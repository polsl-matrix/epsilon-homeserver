name: Pull request validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validate:
    name: Validate codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Tesseract.slnx', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore local dotnet tools
        run: dotnet tool restore

      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --no-banner --redact

      - name: Restore solution
        id: restore
        continue-on-error: true
        run: dotnet restore Tesseract.slnx

      - name: Verify format and analyzers
        id: format
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: dotnet format Tesseract.slnx --verify-no-changes --no-restore

      - name: Build solution
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: dotnet build Tesseract.slnx --configuration Release --no-restore

      - name: Run tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: dotnet test Tesseract.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Build PR summary artifact
        if: always()
        shell: bash
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p artifacts
          status_icon() {
            case "$1" in
              success) printf '✅ success' ;;
              failure) printf '❌ failure' ;;
              skipped) printf '⏭️ skipped' ;;
              cancelled) printf '🚫 cancelled' ;;
              *) printf '⚪ %s' "$1" ;;
            esac
          }

          {
            echo '## PR validation summary'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Gitleaks | $(status_icon "$GITLEAKS_OUTCOME") |"
            echo "| Restore | $(status_icon "$RESTORE_OUTCOME") |"
            echo "| Format + analyzers | $(status_icon "$FORMAT_OUTCOME") |"
            echo "| Build | $(status_icon "$BUILD_OUTCOME") |"
            echo "| Tests | $(status_icon "$TESTS_OUTCOME") |"
            echo
            echo "Run details: $RUN_URL"
          } > artifacts/pr-summary.md

      - name: Upload PR summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-summary
          path: artifacts/pr-summary.md
          retention-days: 7

      - name: Upload test results
        if: always() && steps.tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          retention-days: 7

      - name: Fail workflow when any validation failed
        if: always()
        shell: bash
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [[ "$GITLEAKS_OUTCOME" != "success" || "$RESTORE_OUTCOME" != "success" || "$FORMAT_OUTCOME" != "success" || "$BUILD_OUTCOME" != "success" || "$TESTS_OUTCOME" != "success" ]]; then
            exit 1
          fi
